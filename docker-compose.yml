version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - CORS_ORIGINS=http://localhost:3000
      - TES_GATEWAY=https://tes-gateway.example.com
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./backend/tes_instance_locations.json:/app/tes_instance_locations.json:ro
    networks:
      - tes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=production
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    networks:
      - tes-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tes-network:
    driver: bridge

volumes:
  backend-uploads:
