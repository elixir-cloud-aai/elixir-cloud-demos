apiVersion: v1
kind: ConfigMap
metadata:
  name: tesdashboardanalytics-config
  namespace: default
data:
  FLASK_ENV: "production"
  FLASK_APP: "app.py"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesdashboardanalytics-backend
  namespace: default
  labels:
    app: tesdashboardanalytics-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tesdashboardanalytics-backend
  template:
    metadata:
      labels:
        app: tesdashboardanalytics-backend
    spec:
      containers:
      - name: backend
        image: elixir-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: tesdashboardanalytics-config
              key: FLASK_ENV
        - name: FLASK_APP
          valueFrom:
            configMapKeyRef:
              name: tesdashboardanalytics-config
              key: FLASK_APP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/uploads
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: uploads-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tesdashboardanalytics-backend-service
  namespace: default
  labels:
    app: tesdashboardanalytics-backend
spec:
  selector:
    app: tesdashboardanalytics-backend
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesdashboardanalytics-frontend
  namespace: default
  labels:
    app: tesdashboardanalytics-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tesdashboardanalytics-frontend
  template:
    metadata:
      labels:
        app: tesdashboardanalytics-frontend
    spec:
      containers:
      - name: frontend
        image: elixir-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tesdashboardanalytics-frontend-service
  namespace: default
  labels:
    app: tesdashboardanalytics-frontend
spec:
  selector:
    app: tesdashboardanalytics-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
