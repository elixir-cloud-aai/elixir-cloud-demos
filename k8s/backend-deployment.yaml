apiVersion: apps/v1
kind: Deployment
metadata:
  name: elixir-backend
  labels:
    app: elixir-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elixir-backend
  template:
    metadata:
      labels:
        app: elixir-backend
    spec:
      containers:
      - name: backend
        image: elixir-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/uploads
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: uploads-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elixir-backend-service
  labels:
    app: elixir-backend
spec:
  selector:
    app: elixir-backend
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  type: ClusterIP
