apiVersion: v1
kind: ConfigMap
metadata:
  name: elixir-config
data:
  FLASK_ENV: "production"
  FLASK_APP: "app.py"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elixir-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - elixir-cloud-demo.example.com  # Replace with your domain
    secretName: elixir-tls-secret
  rules:
  - host: elixir-cloud-demo.example.com  # Replace with your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: elixir-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: elixir-frontend-service
            port:
              number: 80
