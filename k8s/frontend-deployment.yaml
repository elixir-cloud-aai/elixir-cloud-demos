apiVersion: apps/v1
kind: Deployment
metadata:
  name: elixir-frontend
  labels:
    app: elixir-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elixir-frontend
  template:
    metadata:
      labels:
        app: elixir-frontend
    spec:
      containers:
      - name: frontend
        image: elixir-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elixir-frontend-service
  labels:
    app: elixir-frontend
spec:
  selector:
    app: elixir-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
