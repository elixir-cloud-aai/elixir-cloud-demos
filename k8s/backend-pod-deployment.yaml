apiVersion: v1
kind: Pod
metadata:
  name: tes-dashboard-backend-pod
  namespace: federated-analytics-showcase
  labels:
    app: federated-analytics-showcase-backend
    app.kubernetes.io/name: tes-dashboard-backend
    app.kubernetes.io/part-of: tes-dashboard-analytics-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: tes-dashboard-backend
    deployment: federated-analytics-showcase-backend
    component: backend
    version: "1.0.0"
  annotations:
    kubernetes.io/limit-ranger: 'LimitRanger plugin set: cpu, memory request for init container git-clone; cpu, memory limit for init container git-clone'
    openshift.io/generated-by: OpenShiftWebConsole
    openshift.io/scc: restricted-v2
    seccomp.security.alpha.kubernetes.io/pod: runtime/default
spec:
  serviceAccountName: default
  priority: 0
  schedulerName: default-scheduler
  enableServiceLinks: true
  terminationGracePeriodSeconds: 30
  preemptionPolicy: PreemptLowerPriority
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  securityContext:
    seLinuxOptions:
      level: 's0:c91,c0'
    fsGroup: 1008190000
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
  
  # Add node selector and image pull secrets like the working pod
  nodeSelector:
    rahti.csc.fi/node-type: worker
  imagePullSecrets:
    - name: default-dockercfg-726ft
  
  initContainers:
    - name: git-clone
      image: alpine/git:latest
      imagePullPolicy: Always
      command:
        - /bin/sh
      args:
        - '-c'
        - |
          echo "🔄 Cloning LATEST dashboard-deploy branch..."
          # Force fresh clone with no cache
          rm -rf /shared/app 2>/dev/null || true
          git clone -b dashboard-deploy --depth 1 https://github.com/elixir-cloud-aai/elixir-cloud-demos.git /shared/app
          echo "✅ Git clone complete - commit: $(cd /shared/app && git log --oneline -1)"
          # Set proper permissions for OpenShift - using federated-analytics-showcase namespace user range
          chmod -R 777 /shared/app
          chown -R 1008190000:0 /shared/app || true
          echo "✅ Permissions set"
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      volumeMounts:
        - name: shared-data
          mountPath: /shared
        - name: kube-api-access-h2nfr
          readOnly: true
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 500Mi
      securityContext:
        capabilities:
          drop:
            - ALL
        runAsUser: 1008190000
        runAsNonRoot: true
        allowPrivilegeEscalation: false

  containers:
    - name: tes-dashboard-backend
      image: python:3.9-slim
      imagePullPolicy: IfNotPresent
      workingDir: /shared/app/backend
      command:
        - /bin/bash
      args:
        - '-c'
        - |
          # Create a writable home directory
          mkdir -p /tmp/home
          export HOME=/tmp/home
          # Install dependencies to user directory
          pip install --user -r requirements.txt
          # Create uploads directory in writable location
          mkdir -p /tmp/uploads
          # Create TES instances file
          cat > .tes_instances << 'EOF'
          # TES Instance Configuration
          # Format: name,url
          # Lines starting with # are comments

          # ELIXIR Cloud TES Instances
          Funnel/OpenPBS @ ELIXIR-CZ,https://funnel.cloud.e-infra.cz/
          Funnel/Slurm @ ELIXIR-FI,https://vm4816.kaj.pouta.csc.fi/
          TESK/Kubernetes @ ELIXIR-CZ (Prod),https://tesk-prod.cloud.e-infra.cz/
          TESK/Kubernetes @ ELIXIR-CZ (NA),https://tesk-na.cloud.e-infra.cz/
          TESK/Kubernetes @ ELIXIR-DE,https://tesk.elixir-cloud.bi.denbi.de/
          TESK/Kubernetes @ ELIXIR-GR,https://tesk-eu.hypatia-comp.athenarc.gr/
          TESK/OpenShift @ ELIXIR-FI,https://csc-tesk-noauth.rahtiapp.fi/
          TESK North America,https://tesk-na.cloud.e-infra.cz/

          # Local Development
          Local TES,http://localhost:8080
          EOF
          # Set environment variables
          export PYTHONPATH=/shared/app/backend:$HOME/.local/lib/python3.9/site-packages
          export UPLOAD_FOLDER=/tmp/uploads
          # Run the application
          python app.py
      
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      
      ports:
        - containerPort: 8000
          protocol: TCP
      
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_DEBUG
          value: "false"
        - name: PORT
          value: "8000"
        - name: CORS_ORIGINS
          value: "http://localhost:3000,https://tes-dashboard-frontend-route-federated-analytics-showcase.2.rahtiapp.fi"
        - name: TES_GATEWAY
          value: "https://tes-gateway.example.com"
        - name: UPLOAD_FOLDER
          value: "/tmp/uploads"
        - name: MAX_CONTENT_LENGTH
          value: "16777216"
        - name: DATABASE_URL
          value: "sqlite:///tmp/app.db"
      
      volumeMounts:
        - name: shared-data
          mountPath: /shared

        - name: kube-api-access-h2nfr
          readOnly: true
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      
      # Health checks - exact same as working pod
      livenessProbe:
        httpGet:
          path: /
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 90
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      
      readinessProbe:
        httpGet:
          path: /
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 60
        timeoutSeconds: 1
        periodSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      
      # Resource limits - exact same as working pod
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      
      securityContext:
        capabilities:
          drop:
            - ALL
        runAsUser: 1008190000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
  
  volumes:
    - name: shared-data
      emptyDir: {}
    - name: kube-api-access-h2nfr
      projected:
        sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
          - configMap:
              name: openshift-service-ca.crt
              items:
                - key: service-ca.crt
                  path: service-ca.crt
              optional: true
        defaultMode: 420

---
apiVersion: v1
kind: Service
metadata:
  name: tes-dashboard-backend-service
  namespace: federated-analytics-showcase
  labels:
    app: federated-analytics-showcase-backend
    component: backend-service
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30802
      protocol: TCP
      name: http
  selector:
    app: federated-analytics-showcase-backend
