# OpenShift-compatible deployment for TES Dashboard Analytics
# Fixed version with proper permissions and init containers

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesdashboardanalytics-backend
  annotations:
    alpha.image.policy.openshift.io/resolve-names: '*'
    app.openshift.io/route-disabled: 'false'
    openshift.io/generated-by: OpenShiftWebConsole
  labels:
    app: tesdashboardanalytics-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: tesdashboardanalytics
    app.kubernetes.io/name: tesdashboardanalytics-backend
    app.kubernetes.io/part-of: tes-dashboard-analytics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tesdashboardanalytics-backend
  template:
    metadata:
      labels:
        app: tesdashboardanalytics-backend
        deployment: tesdashboardanalytics-backend
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              git clone https://github.com/elixir-cloud-aai/elixir-cloud-demos.git /shared/app
              chmod -R 777 /shared/app
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      containers:
        - name: tesdashboardanalytics-backend
          image: python:3.9-slim
          ports:
            - containerPort: 5000
              protocol: TCP
          workingDir: /shared/app/backend
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Install dependencies to user directory
              pip install --user -r requirements.txt
              # Create uploads directory in writable location
              mkdir -p /tmp/uploads
              # Set environment variables
              export PYTHONPATH=/shared/app/backend:$HOME/.local/lib/python3.9/site-packages
              export UPLOAD_FOLDER=/tmp/uploads
              # Run the application
              python app.py
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      volumes:
        - name: shared-data
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: tesdashboardanalytics-backend-service
  labels:
    app: tesdashboardanalytics-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: tesdashboardanalytics
    app.kubernetes.io/name: tesdashboardanalytics-backend
spec:
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: tesdashboardanalytics-backend
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesdashboardanalytics-frontend
  annotations:
    alpha.image.policy.openshift.io/resolve-names: '*'
    app.openshift.io/route-disabled: 'false'
    openshift.io/generated-by: OpenShiftWebConsole
  labels:
    app: tesdashboardanalytics-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: tesdashboardanalytics
    app.kubernetes.io/name: tesdashboardanalytics-frontend
    app.kubernetes.io/part-of: tes-dashboard-analytics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tesdashboardanalytics-frontend
  template:
    metadata:
      labels:
        app: tesdashboardanalytics-frontend
        deployment: tesdashboardanalytics-frontend
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
    spec:
      initContainers:
        - name: git-clone-frontend
          image: alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              git clone https://github.com/elixir-cloud-aai/elixir-cloud-demos.git /shared/app
              chmod -R 777 /shared/app
          volumeMounts:
            - name: shared-data-frontend
              mountPath: /shared
      containers:
        - name: tesdashboardanalytics-frontend
          image: node:18-alpine
          ports:
            - containerPort: 3000
              protocol: TCP
          workingDir: /shared/app/frontend
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Set npm cache to writable location
              export npm_config_cache=/tmp/.npm
              # Install dependencies
              npm install
              # Build the application
              npm run build
              # Serve the built app
              npx serve -s build -l 3000
          volumeMounts:
            - name: shared-data-frontend
              mountPath: /shared
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      volumes:
        - name: shared-data-frontend
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: tesdashboardanalytics-frontend-service
  labels:
    app: tesdashboardanalytics-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: tesdashboardanalytics
    app.kubernetes.io/name: tesdashboardanalytics-frontend
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: tesdashboardanalytics-frontend
  type: LoadBalancer

---
# OpenShift Route for external access
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tesdashboardanalytics-route
  labels:
    app: tesdashboardanalytics-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: tesdashboardanalytics
spec:
  to:
    kind: Service
    name: tesdashboardanalytics-frontend-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
